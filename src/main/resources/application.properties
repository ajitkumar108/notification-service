spring.application.name=notification-service

# =========================
# MySQL Configuration
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/notificationdb
spring.datasource.username=root
spring.datasource.password=Ajit@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Server
# =========================
server.port=8080

# =========================
# Logging
# =========================
logging.level.org.springframework=INFO
logging.level.com.example.notification_service=DEBUG

# =========================
# JWT
# =========================
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000

# =========================
# Swagger
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

# spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# spring.kafka.consumer.properties.spring.json.trusted.packages=*

# spring.kafka.consumer.properties.spring.json.value.default.type=com.example.notification_service.kafka.NotificationEvent

# =========================
# Redis
# =========================
spring.data.redis.host=localhost
spring.data.redis.port=6379
